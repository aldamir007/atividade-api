
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API Hello</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #e8f5e9;
            overflow-wrap: anywhere;
        }

        #response:empty {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Formulário da API Hello v2</h1>

    <form id="greetForm">
        <div class="form-group">
            <label for="name">Seu nome:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                placeholder="Digite seu nome"
            >
        </div>

        <div class="form-group">
            <label for="lang">Escolha o idioma:</label>

            <select id="lang" name="lang">
                <option value="pt-br">Português brasileiro</option>
                <option value="es">Espanhol</option>
                <option value="en">Inglês</option>
            </select>
        </div>

        <button type="submit">Enviar saudação</button>
    </form>

    <div id="response" role="status" aria-live="polite"></div>

    <script>
        const form = document.getElementById('greetForm');
        const response = document.getElementById('response');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const lang = document.getElementById('lang').value;

            response.textContent = 'Carregando...';

            try {
                const result = await fetch(
                    'http://localhost:8000/v2/hi',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/x-www-form-urlencoded'
                        },
                        body: new URLSearchParams({
                            name: name,
                            lang: lang
                        })
                    }
                );

                const data = await result.json();

                if (!result.ok) {
                    throw new Error(data.error || 'Erro na requisição');
                }

                response.textContent = data.msg;
            } catch (error) {
                response.textContent =
                    'Não foi possível obter a saudação. Verifique se a API está funcionando.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
